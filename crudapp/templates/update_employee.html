
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Employee</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold"
               href="{% url 'employee_list' %}">
                Employee Management
            </a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link"
                   href="{% url 'employee_list' %}">Home</a>

                <a class="nav-link"
                   href="{% url 'register_employee' %}">Register Employee</a>
            </div>
        </div>
    </nav>

    <!-- Update Form -->
    <div class="container mt-5 mb-5">

        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">

                <div class="card shadow">

                    <div class="card-header bg-primary text-white py-3">
                        <h3 class="mb-0">Update Employee Details</h3>
                        <p class="mb-0 mt-1">
                            Employee ID: {{ employee.id }}
                        </p>
                    </div>

                    <div class="card-body p-4">

                        <form method="POST"
                              action="{% url 'update_employee' employee.id %}">

                            {% csrf_token %}

                            <!-- Name -->
                            <div class="mb-3">
                                <label for="name" class="form-label">
                                    Employee Name
                                </label>

                                <input type="text"
                                       id="name"
                                       name="name"
                                       class="form-control"
                                       value="{{ employee.name }}"
                                       maxlength="100"
                                       required>
                            </div>

                            <!-- Age -->
                            <div class="mb-3">
                                <label for="age" class="form-label">
                                    Age
                                </label>

                                <input type="number"
                                       id="age"
                                       name="age"
                                       class="form-control"
                                       value="{{ employee.age }}"
                                       min="1"
                                       required>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email Address
                                </label>

                                <input type="email"
                                       id="email"
                                       name="email"
                                       class="form-control"
                                       value="{{ employee.email }}"
                                       required>
                            </div>

                            <!-- Phone -->
                            <div class="mb-3">
                                <label for="phone" class="form-label">
                                    Phone Number
                                </label>

                                <input type="tel"
                                       id="phone"
                                       name="phone"
                                       class="form-control"
                                       value="{{ employee.phone }}"
                                       maxlength="15"
                                       required>
                            </div>

                            <!-- Address -->
                            <div class="mb-3">
                                <label for="address" class="form-label">
                                    Address
                                </label>

                                <textarea id="address"
                                          name="address"
                                          class="form-control"
                                          rows="3"
                                          required>{{ employee.address }}</textarea>
                            </div>

                            <!-- Department -->
                            <div class="mb-3">
                                <label for="department" class="form-label">
                                    Department
                                </label>

                                <input type="text"
                                       id="department"
                                       name="department"
                                       class="form-control"
                                       value="{{ employee.department }}"
                                       maxlength="100"
                                       required>
                            </div>

                            <!-- Salary -->
                            <div class="mb-3">
                                <label for="salary" class="form-label">
                                    Salary (₹)
                                </label>

                                <input type="number"
                                       id="salary"
                                       name="salary"
                                       class="form-control"
                                       value="{{ employee.salary }}"
                                       min="0"
                                       step="0.01"
                                       required>
                            </div>

                            <!-- Joining Date -->
                            <div class="mb-4">
                                <label for="joining_date" class="form-label">
                                    Joining Date
                                </label>

                                <input type="date"
                                       id="joining_date"
                                       name="joining_date"
                                       class="form-control"
                                       value="{{ employee.joining_date|date:'Y-m-d' }}"
                                       required>
                            </div>

                            <!-- Buttons -->
                            <div class="d-flex gap-2">

                                <button type="submit"
                                        class="btn btn-primary">
                                    Update Employee
                                </button>

                                <a href="{% url 'employee_list' %}"
                                   class="btn btn-secondary">
                                    Cancel
                                </a>

                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
